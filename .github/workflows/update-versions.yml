name: Update official PC versions
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-versions.yml'
      - 'scripts/**'
permissions:
  contents: write
concurrency:
  group: update-versions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s scripts -v
      - name: Merge official PC version
        run: python scripts/update_versions.py
      - name: Commit changed catalog
        shell: bash
        run: |
          if ! git diff --quiet -- versions.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add versions.json
            git commit -m 'chore: update official PC version catalog'
            git push
          fi
